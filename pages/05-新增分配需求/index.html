<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品枢纽平台 · 新增分配需求</title>
  <link rel="stylesheet" href="../../css/app.css">
</head>
<body data-standalone="assignNew">
  <header class="header" id="header">
    <div class="header-inner">
      <a class="logo" id="logoHome" href="#/me/todo" title="产品枢纽平台">
        <img src="../../img/logo-nav.svg" width="144" height="30" alt="产品枢纽平台">
      </a>

      <nav class="nav" id="nav">
        <button class="nav-item is-current" data-key="market">市场管理<svg class="nav-arrow" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="nav-item" data-key="req">需求管理<svg class="nav-arrow" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="nav-item" data-key="product">产品管理<svg class="nav-arrow" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="nav-item" data-key="config">配置管理<svg class="nav-arrow" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="nav-item" data-key="me">个人中心<svg class="nav-arrow" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </nav>

      <div class="header-right">
        <div class="portal-switch" id="portalSwitch">
          <span class="portal-label">IPD管理门户</span>
          <span class="caret" aria-hidden="true"></span>
          <div class="portal-menu">
            <button type="button" data-portal="ops">产品运营门户</button>
            <button type="button" data-portal="ipd" class="is-active">IPD管理门户</button>
          </div>
        </div>

        <div class="user-entry" id="userEntry">
          <img src="../../img/avatar-admin-right.svg" width="32" height="32" alt="超级管理员">
          <span class="uname">超级管理员</span>
          <div class="user-menu">
            <button id="goTodo">待办工作台</button>
            <button type="button" onclick="goPath('#/me/notices')">公告消息</button>
          </div>
        </div>
      </div>
    </div>

    <div class="mega-mask" id="megaMask"></div>
    <div class="mega" id="mega">
      <div class="mega-inner">
        <aside class="mega-l1">
          <button type="button" class="mega-l1-name" id="megaL1Btn">
            <span id="megaL1Title">市场管理</span>
          </button>
        </aside>
        <div class="mega-right">
          <div class="mega-cols" id="megaBody"></div>
          <button class="mega-close" id="megaClose" aria-label="关闭">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="tags-bar">
    <div class="tags-list" id="tagsList"></div>
    <div class="tags-more" id="tagsMore">
      <button type="button" class="tags-more-btn" id="tagsMoreBtn">
        操作
        <span class="caret" aria-hidden="true"></span>
      </button>
      <div class="tags-more-menu">
        <button type="button" data-close-act="others">关闭其它</button>
        <button type="button" data-close-act="all">关闭全部</button>
        <button type="button" data-close-act="fullscreen">全屏</button>
      </div>
    </div>
  </div>

  <main class="main">
    <section id="pageReqAssignForm" class="hidden">
      <div class="rd-head">
        <button type="button" class="rd-back" id="afBack" aria-label="返回">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3.5L5.5 8 10 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <h1 class="page-title">需求分配决策</h1>
        <div class="ad-lead-tags">
          <span class="linetag t-ing">AR 需求</span>
          <span class="linetag t-warn">待分配</span>
        </div>
        <div class="rd-head-ops">
          <button type="button" class="btn btn-ghost" id="afCancel">取消</button>
          <button type="button" class="btn btn-ghost is-brand" id="afCdt">纳入 CDT</button>
          <button type="button" class="btn btn-primary" id="afPdt">纳入 PDT</button>
          <button type="button" class="btn btn-ghost is-brand" id="afNext">放入下一年度</button>
        </div>
      </div>
      <div class="as-split">
        <div class="as-main">
          <section class="fm-card">
            <h3 class="fm-hd"><span class="wb-hd-ico" aria-hidden="true"><img src="../../img/detail/file.svg" alt=""></span>AR 基础信息</h3>
            <div class="fm-grid">
              <div class="fm-item"><label class="fm-lab"><i>*</i>需求名称</label><input class="ctrl" value="测试2"></div>
              <div class="fm-item"><label class="fm-lab"><i>*</i>需求来源</label><input class="ctrl" value="集团任务"></div>
              <div class="fm-item"><label class="fm-lab"><i>*</i>需求类别</label><input class="ctrl" value="功能需求-新增功能"></div>
              <div class="fm-item"><label class="fm-lab"><i>*</i>所属产品</label><input class="ctrl" value="12580"></div>
              <div class="fm-item"><label class="fm-lab">子产品</label><input class="ctrl" placeholder="请输入子产品"></div>
              <div class="fm-item"><label class="fm-lab">涉及产品版本</label><input class="ctrl" value="11"></div>
            </div>
          </section>
          <section class="fm-card">
            <h3 class="fm-hd"><span class="wb-hd-ico" aria-hidden="true"><img src="../../img/detail/report.svg" alt=""></span>需求详情</h3>
            <div class="fm-item is-full"><label class="fm-lab">需求描述</label><div class="dlg-area"><textarea placeholder="请填写需求描述">测试 2 的需求说明，用于分配决策验证。</textarea></div></div>
            <div class="fm-item is-full"><label class="fm-lab">技术成熟度</label><div class="dlg-area"><textarea placeholder="请填写技术成熟度"></textarea></div></div>
            <div class="fm-item is-full"><label class="fm-lab">初步方案建议</label><div class="dlg-area"><textarea placeholder="请填写初步方案建议"></textarea></div></div>
          </section>
          <section class="fm-card">
            <h3 class="fm-hd"><span class="wb-hd-ico" aria-hidden="true"><img src="../../img/detail/plan.svg" alt=""></span>价值与优先级</h3>
            <div class="fm-grid n3">
              <div class="fm-item"><label class="fm-lab">紧急程度</label><input class="ctrl" value="高"></div>
              <div class="fm-item"><label class="fm-lab">建议优先级</label><input class="ctrl" value="高"></div>
              <div class="fm-item"><label class="fm-lab">期望上线时间</label><input class="ctrl" value="2026-08-27"></div>
              <div class="fm-item"><label class="fm-lab">预估收入（万元）</label><input class="ctrl" value="0"></div>
              <div class="fm-item"><label class="fm-lab">影响用户数（万）</label><input class="ctrl" value="1"></div>
            </div>
          </section>
          <section class="fm-card">
            <h3 class="fm-hd"><span class="wb-hd-ico" aria-hidden="true"><img src="../../img/detail/progress.svg" alt=""></span>研发计划</h3>
            <div class="fm-grid">
              <div class="fm-item"><label class="fm-lab">计划开发时间</label><button type="button" class="cal-input" id="afDev" data-cal="single" data-ph="请选择日期"><span class="cal-val is-ph">请选择日期</span><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="3" width="10" height="9" rx="1" stroke="currentColor"/><path d="M2 6h10M5 1.5v2.5M9 1.5v2.5" stroke="currentColor" stroke-linecap="round"/></svg></button></div>
              <div class="fm-item"><label class="fm-lab">计划上线时间</label><button type="button" class="cal-input" id="afOn" data-cal="single" data-ph="请选择日期"><span class="cal-val is-ph">请选择日期</span><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="2" y="3" width="10" height="9" rx="1" stroke="currentColor"/><path d="M2 6h10M5 1.5v2.5M9 1.5v2.5" stroke="currentColor" stroke-linecap="round"/></svg></button></div>
              <div class="fm-item"><label class="fm-lab">预计开发周期</label><input class="ctrl" placeholder="如 2 周、3 个月"></div>
              <div class="fm-item"><label class="fm-lab">开发工作量（人天）</label><input class="ctrl" placeholder="请输入"></div>
            </div>
          </section>
          <section class="fm-card">
            <h3 class="fm-hd"><span class="wb-hd-ico" aria-hidden="true"><img src="../../img/detail/note.svg" alt=""></span>分配决策说明</h3>
            <div class="fm-item is-full"><div class="dlg-area"><textarea placeholder="请填写分配决策依据、范围、协同团队与计划安排..."></textarea></div></div>
          </section>
          <section class="fm-card">
            <h3 class="fm-hd"><span class="wb-hd-ico" aria-hidden="true"><img src="../../img/detail/attachment.svg" alt=""></span>需求附件</h3>
            <div class="up-zone">
              <img src="../../img/file-resource.svg" alt="">
              <p>上传分析报告、技术方案等，或 <a class="link" href="javascript:;">点击选择</a></p>
              <span>支持 PDF、Word、Excel、PNG、JPG，单个文件不超过 20MB</span>
            </div>
          </section>
        </div>
        <aside class="ir-side">
          <section class="side-card">
            <h3 class="side-card-hd">已选 IR 需求<em>1</em><button type="button" class="link ir-add" id="afAddIr">+ 添加 IR 需求</button></h3>
            <div class="ir-item">
              <div>
                <b>IR-1780-202608269705</b>
                <span>测试2</span>
              </div>
              <button type="button" class="link" id="afDelIr">删除</button>
            </div>
          </section>
        </aside>
      </div>
    </section>
  </main>

  

  <div class="dlg hidden" id="confirmDlg">
    <div class="dlg-mask" id="confirmMask"></div>
    <div class="dlg-card confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <button type="button" class="dlg-x" id="confirmClose" aria-label="关闭">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <div class="confirm-hd">
        <span class="confirm-ico" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="12" fill="#FFC53D"/><path d="M12 7v6.2" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="16.6" r="1.15" fill="#fff"/></svg>
        </span>
        <h3 id="confirmTitle">确定要删除吗？</h3>
      </div>
      <p class="confirm-desc" id="confirmDesc"></p>
      <div class="dlg-ft">
        <button type="button" class="btn btn-ghost" id="confirmCancel">取消</button>
        <button type="button" class="btn btn-primary" id="confirmOk">确定</button>
      </div>
    </div>
  </div>

  <div class="cal-pop hidden" id="calPop"></div>

  <div class="toast" id="toast">
    <span class="toast-ico is-ok" aria-hidden="true">
      <img src="../../img/toast-success.svg" width="28" height="28" alt="">
    </span>
    <span class="toast-ico is-fail" aria-hidden="true">
      <img src="../../img/toast-error.svg" width="28" height="28" alt="">
    </span>
    <span class="toast-txt"></span>
  </div>

  <script src="../../js/app.js"></script>
</body>
</html>
